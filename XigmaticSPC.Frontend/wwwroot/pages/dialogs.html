<template id="tpl-start"><h2 id="dialog-title">Start an inspection</h2><p class="dialog-intro">Select a published plan and confirm the production batch. Existing sessions resume where you left off.</p><form id="start-form"><label>Inspection plan<select name="planId" required>{{#each plans}}<option value="{{id}}" gaffa-selected="selected">{{station}} · {{name}}</option>{{/each}}</select></label><div class="form-row"><label>Batch code<input name="batch" value="{{batch}}" required></label><label>Operator<input value="{{actor}}" disabled></label></div><div class="info-note"><span class="icon" aria-hidden="true">lock</span><span>The session pins this plan revision. Later plan changes do not alter an inspection in progress.</span></div><div class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" class="button" data-action="close-dialog">Cancel</button><button class="button primary" type="submit">Start / resume inspection<span class="icon" aria-hidden="true">arrow_forward</span></button></div></form></template>
<template id="tpl-event"><span class="badge {{tone}}">{{status}}</span><h2 id="dialog-title">{{id}} · {{type}}</h2><p class="dialog-intro">{{station}} / {{characteristic}} · {{time}}</p><div class="event-evidence"><strong>{{reading}} <small>{{unit}}</small></strong><div><span class="badge {{specTone}}">{{specStatus}}</span><span class="badge {{statTone}}">{{statStatus}}</span></div><p>{{ruleText}}</p><small>Evaluation: {{measurementId}} · Baseline: {{baselineId}}</small></div>{{#if superseded}}<div class="info-note"><span class="icon" aria-hidden="true">history</span><span>This event is retained as superseded evidence following a correction.</span></div>{{/if}}<form id="event-form" data-id="{{id}}"><div class="form-row"><label>Suspected cause <span class="required">*</span><input name="cause" value="{{cause}}" required gaffa-disabled="closed" placeholder="What might have changed?"></label><label>Owner<input name="owner" value="{{owner}}" gaffa-disabled="closed"></label></div><label>Action taken <span class="required">*</span><input name="action" value="{{action}}" required gaffa-disabled="closed" placeholder="What has been checked, contained or adjusted?"></label><label>Response notes / closure outcome <span class="required">*</span><textarea name="notes" rows="3" required gaffa-disabled="closed" placeholder="Describe the evidence and next steps.">{{notes}}</textarea></label><div class="form-error" role="alert"></div>{{#ifnot closed}}<div class="dialog-actions"><button class="button" type="submit" name="status" value="Acknowledged"><span class="icon" aria-hidden="true">visibility</span>Save & acknowledge</button><button class="button primary" type="submit" name="status" value="Closed" gaffa-disabled="cannotApprove"><span class="icon" aria-hidden="true">task_alt</span>Close with outcome</button></div>{{/ifnot}}</form><details class="timeline"><summary>Event history · {{transitionCount}} transitions</summary>{{#each transitions}}<p><span class="status-dot blue"></span><strong>{{status}}</strong> · {{actor}}<small>{{time}}</small></p>{{/each}}</details></template>
<template id="tpl-baseline"><span class="badge blue">FROZEN REFERENCE</span><h2 id="dialog-title">{{station}} · {{name}}</h2><p class="dialog-intro">Review the first 25 reference observations before approving a new baseline version.</p><div class="baseline-numbers"><div><span>Reference n</span><strong>{{count}}</strong></div><div><span>Mean</span><strong>{{mean}}</strong></div><div><span>MR average</span><strong>{{mr}}</strong></div><div><span>Estimated σ</span><strong>{{sigma}}</strong></div></div><div class="chart modal-chart" data-chart="baseline"></div><dl><dt>Proposed Individuals limits</dt><dd>{{lcl}} – {{ucl}} {{unit}}</dd><dt>Proposed MR upper limit</dt><dd>{{mrUcl}} {{unit}}</dd><dt>Current approved version</dt><dd>{{baselineId}}</dd><dt>Current approval</dt><dd>{{approval}}</dd></dl><form id="baseline-form" data-id="{{id}}"><label>Review decision / reason <span class="required">*</span><textarea name="reason" rows="3" required placeholder="Why is this reference set suitable for monitoring this process?"></textarea></label><label class="checkbox-label"><input type="checkbox" required>I reviewed the reference observations and sampling context.</label><div class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" class="button" data-action="close-dialog">Keep current baseline</button><button class="button primary" type="submit" gaffa-disabled="cannotApprove">Approve new version<span class="icon" aria-hidden="true">check</span></button></div></form></template>
<template id="tpl-measurement"><span class="eyebrow">OBSERVATION EVIDENCE</span><h2 id="dialog-title">{{value}} {{unit}}</h2><p class="dialog-intro">{{station}} / {{name}} · Measurement revision {{revision}}</p><div class="evidence-badges"><span class="badge {{specTone}}">{{specStatus}}</span><span class="badge {{tone}}">{{statStatus}}</span></div><dl><dt>Measured at</dt><dd>{{measuredAt}}</dd><dt>Recorded at</dt><dd>{{recordedAt}}</dd><dt>Production order</dt><dd>{{orderNumber}}</dd><dt>Product code</dt><dd>{{productCode}}</dd><dt>Batch / segment</dt><dd>{{batch}} / {{segment}}</dd><dt>Applicable specification</dt><dd>{{lsl}}–{{usl}} {{unit}}</dd><dt>Actor / source</dt><dd>{{operator}} / {{source}}</dd><dt>Definition</dt><dd>{{productRev}} / {{charRev}}</dd><dt>Specification / baseline</dt><dd>{{specRev}} / {{baselineId}}</dd><dt>Moving range</dt><dd>{{mr}}</dd><dt>Rule evidence</dt><dd>{{ruleText}}</dd></dl><details><summary>Correct this observation</summary><form id="correction-form" data-id="{{id}}"><div class="info-note"><span class="icon" aria-hidden="true">history</span><span>A correction appends a revision and retains the original value. Correcting a reference observation invalidates the baseline approval.</span></div><label>Corrected value<input name="value" inputmode="decimal" value="{{value}}" required></label><label>Correction reason<input name="reason" required placeholder="Explain the correction"></label><div class="form-error" role="alert"></div><button type="submit" class="button primary" gaffa-disabled="cannotApprove">Save correction</button></form></details>{{#if hasRevisions}}<details><summary>Previous revisions</summary>{{#each revisions}}<p>r{{revision}}: <strong>{{value}}</strong> · {{reason}}<small class="cell-sub">{{actor}} · {{at}}</small></p>{{/each}}</details>{{/if}}</template>
<template id="tpl-plan">
  <h2 id="dialog-title">{{title}}</h2><p class="dialog-intro">{{intro}}</p>
  <form id="plan-form" class="plan-builder" data-id="{{id}}">
    <label>Plan name <span class="required">*</span><input name="name" value="{{name}}" required maxlength="120" placeholder="For example, Shaft first-off inspection"></label>
    <label>Workstation <span class="required">*</span><select name="station" required gaffa-disabled="stationLocked">{{#each stations}}<option value="{{id}}" gaffa-selected="selected">{{id}}</option>{{/each}}</select></label>
    <div class="plan-builder-context"><span>Product / revision</span><strong id="plan-product"></strong></div>
    <div class="plan-selection-heading"><strong id="plan-characteristics-label">Characteristics & order</strong><span id="plan-selection-count" role="status" aria-live="polite"></span></div>
    <p class="plan-selection-help">Select at least one characteristic. Use the arrows to set its inspection order.</p>
    <div id="plan-characteristics" class="plan-step-editor" role="group" aria-labelledby="plan-characteristics-label"></div>
    <label>Publication reason <span class="required">*</span><textarea name="reason" rows="2" required placeholder="{{reasonPlaceholder}}"></textarea></label>
    <div class="info-note"><span class="icon" aria-hidden="true">lock</span><span>Publishing creates revision {{nextRevision}} and makes this plan available for inspections. Running sessions keep their pinned revision and ordered steps.</span></div>
    <p class="plan-role-note" gaffa-hidden="canApprove">Switch to the Quality engineer persona to publish inspection plans.</p>
    <div class="form-error" role="alert"></div>
    <div class="dialog-actions"><button type="button" class="button" data-action="close-dialog">Discard draft</button><button type="submit" class="button primary" gaffa-disabled="cannotApprove">{{publishLabel}}<span class="icon" aria-hidden="true">publish</span></button></div>
  </form>
</template>
<template id="tpl-plan-characteristic"><div class="plan-step-row" data-stream="{{id}}"><label><input type="checkbox" name="characteristic" value="{{id}}" gaffa-checked="selected" aria-label="Include {{name}}"><span><strong>{{name}}</strong><small>{{charRev}} · {{limits}}</small></span></label><button class="icon-button" type="button" data-plan-action="up" aria-label="Move {{name}} up"><span class="icon" aria-hidden="true">arrow_upward</span></button><button class="icon-button" type="button" data-plan-action="down" aria-label="Move {{name}} down"><span class="icon" aria-hidden="true">arrow_downward</span></button></div></template>
<template id="tpl-role"><h2 id="dialog-title">Explore another role</h2><p class="dialog-intro">Try the workflows from a different perspective. These are demo permissions stored in your browser.</p><form id="role-form"><label>Demo role<select name="role">{{#each roles}}<option value="{{name}}" gaffa-selected="selected">{{name}}</option>{{/each}}</select></label><div class="role-descriptions"><p><strong>Quality engineer</strong>Configure plans, approve baselines, correct readings and close investigations.</p><p><strong>Operator</strong>Run inspections, record measurements and acknowledge warnings.</p><p><strong>Viewer</strong>Explore monitoring, reports and history.</p></div><div class="dialog-actions"><button class="button primary" type="submit">Switch role<span class="icon" aria-hidden="true">arrow_forward</span></button></div></form></template>
<template id="tpl-guide"><span class="badge blue">XIGMATIC SPC DEMO</span><h2 id="dialog-title">Your meeting workspace</h2><p class="dialog-intro">The customer walkthrough follows a synthetic food-production order through inspection, response, verification and an order report.</p><p>Open Customer walkthrough for the step-by-step route and presenter notes. Load the scenario explicitly to prepare a fresh meeting. Reset demo data restores whichever scenario is active.</p><div class="info-note"><span class="icon" aria-hidden="true">science</span><span>Data stays in this browser. M3, Kameloen, email, identity, production storage and API / MCP connections are planned implementation work. Product limits are illustrative.</span></div><div class="dialog-actions"><button class="button" data-action="restore-industrial">Restore industrial scenario</button><button class="button primary" data-action="go" data-page="walkthrough">Customer walkthrough<span class="icon" aria-hidden="true">arrow_forward</span></button></div></template>
<template id="tpl-configure"><span class="badge blue">{{charRev}}</span><h2 id="dialog-title">{{station}} · {{name}}</h2><p class="dialog-intro">Publish a specification and instruction revision for future inspections. Existing measurements retain their applicable limits.</p><form id="configure-form" data-id="{{id}}"><div class="form-row"><label>Lower specification<input name="lsl" inputmode="decimal" value="{{lsl}}" required></label><label>Target<input name="target" inputmode="decimal" value="{{target}}" required></label><label>Upper specification<input name="usl" inputmode="decimal" value="{{usl}}" required></label></div><label>Measurement instructions<textarea name="instruction" rows="4" required>{{instruction}}</textarea></label><label>Publication reason<input name="reason" required placeholder="Describe the engineering change"></label><div class="info-note"><span class="icon" aria-hidden="true">lock</span><span>Unit: {{unit}} · Active control limits stay frozen. Running inspections keep their pinned instructions and specification. This editor changes the specification only; measurement method or unit changes require a new process definition.</span></div><div class="form-error" role="alert"></div><div class="dialog-actions"><button class="button" type="button" data-action="close-dialog">Discard draft</button><button class="button primary" type="submit" gaffa-disabled="cannotApprove">Publish definition<span class="icon" aria-hidden="true">publish</span></button></div></form></template>
<template id="tpl-abandon"><h2 id="dialog-title">Abandon inspection</h2><p class="dialog-intro">Saved observations and their quality events remain in history.</p><form id="abandon-form" data-id="{{id}}"><label>Reason<textarea name="reason" rows="3" required></textarea></label><div class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" class="button" data-action="close-dialog">Keep inspecting</button><button type="submit" class="button danger">Abandon session</button></div></form></template>
<template id="tpl-single-entry"><span class="badge blue">INDIVIDUAL OBSERVATION</span><h2 id="dialog-title">{{station}} · {{name}}</h2><p class="dialog-intro">{{instruction}}</p><div class="entry-specs"><div><span>Lower specification</span><strong>{{lsl}} <small>{{unit}}</small></strong></div><div><span>Target</span><strong>{{target}} <small>{{unit}}</small></strong></div><div><span>Upper specification</span><strong>{{usl}} <small>{{unit}}</small></strong></div></div><form id="single-entry-form" data-id="{{id}}"><input type="hidden" name="orderId" value="{{orderId}}">{{#if customer}}<p class="field-help">Production order {{orderNumber}} · {{batch}}</p>{{/if}}<input type="hidden" name="submissionId" value="{{submissionId}}"><div class="form-row"><label>Measured value ({{unit}})<input name="value" inputmode="decimal" required autocomplete="off" placeholder="{{target}}"></label><label>Batch code<input name="batch" value="{{batch}}" required gaffa-disabled="customer"></label></div><div class="info-note"><span class="icon" aria-hidden="true">person</span><span>{{actor}} · Manual entry · {{charRev}} · Timestamp recorded when saved. Decimal point required.</span></div><div class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" class="button" data-action="close-dialog">Cancel</button><button type="submit" class="button primary">Save & evaluate<span class="icon" aria-hidden="true">arrow_forward</span></button></div></form></template>
<template id="tpl-reset"><h2 id="dialog-title">Restore the demo scenario?</h2><p class="dialog-intro">Your browser’s demo readings, responses, configuration changes and dashboards will be replaced by the initial data for the current scenario.</p><div class="dialog-actions"><button class="button" data-action="close-dialog">Keep exploring</button><button class="button primary" data-action="confirm-reset">Restore demo data</button></div></template>

<template id="tpl-inspection-evaluation">
  <h2 id="dialog-title">{{name}}</h2><p class="inspection-evaluation-meta">{{station}} · {{charRev}} · {{entryLabel}}</p>
  <div class="inspection-evaluation-reading {{statusTone}}"><strong>{{entryValue}} <small>{{unit}}</small></strong><div><span class="badge {{specTone}}">{{specText}}</span><span class="badge {{statTone}}">{{statText}}</span></div><p>{{message}}</p></div>
  <section class="inspection-evaluation-section"><h3>Specification</h3><dl><dt>Lower limit</dt><dd>{{lsl}} {{unit}}</dd><dt>Target</dt><dd>{{target}} {{unit}}</dd><dt>Upper limit</dt><dd>{{usl}} {{unit}}</dd><dt>Revision</dt><dd>{{specRev}}</dd></dl></section>
  <section class="inspection-evaluation-section"><h3>Statistical evaluation</h3><dl><dt>Control range</dt><dd>{{controlRange}}</dd><dt>Moving range</dt><dd>{{mrValue}}</dd><dt>Moving range UCL</dt><dd>{{mrLimit}}</dd><dt>Baseline</dt><dd>{{baselineLabel}}</dd></dl><p>{{ruleText}}</p></section>
  <div class="dialog-actions"><button class="button" type="button" data-action="close-dialog">Close</button><button class="button" type="button" data-action="measurement" data-id="{{measurementId}}" gaffa-hidden="notSaved">View reading<span class="icon" aria-hidden="true">arrow_outward</span></button><button class="button primary" type="button" data-action="event" data-id="{{eventId}}" gaffa-hidden="noResponseRequired">Required response<span class="icon" aria-hidden="true">arrow_forward</span></button></div>
</template>

<template id="tpl-start-order">
  <span class="badge blue">SYNTHETIC PRODUCTION ORDER</span><h2 id="dialog-title">Start an order inspection</h2><p class="dialog-intro">Select an order. Product, line and batch are carried into every reading.</p>
  <form id="start-order-form"><label for="start-order-select">Production order<select id="start-order-select" name="orderId" required>{{#each orders}}<option value="{{id}}" gaffa-selected="selected">{{number}} · {{product}} · {{batch}}</option>{{/each}}</select></label><div class="order-dialog-context"><p id="start-order-context"></p><p class="order-source">Demonstration data · M3 is not connected</p></div><p class="field-help">{{actor}} · The plan and specification revisions are pinned when this inspection starts.</p><div class="form-error" role="alert"></div><div class="dialog-actions"><button class="button" type="button" data-action="close-dialog">Cancel</button><button class="button primary" type="submit" gaffa-disabled="cannotWrite">Start / resume inspection<span class="icon" aria-hidden="true">arrow_forward</span></button></div></form>
</template>

<template id="tpl-customer-event">
  <span class="badge {{tone}}">{{status}}</span><h2 id="dialog-title">{{id}} · {{type}}</h2><p class="dialog-intro">{{orderNumber}} · {{station}} / {{characteristic}} · {{date}} {{time}}</p>
  <div class="event-evidence"><strong>{{reading}} <small>{{unit}}</small></strong><div><span class="badge {{specTone}}">{{specStatus}}</span><span class="badge {{statTone}}">{{statStatus}}</span></div><p>{{ruleText}}</p><small>Original specification: {{specRange}} · {{specRev}} · Baseline {{baselineId}}</small><button class="text-link report-proof-link" data-action="measurement" data-id="{{measurementId}}">View original reading<span class="icon" aria-hidden="true">arrow_outward</span></button></div>
  <dl class="event-context"><dt>Product / batch</dt><dd>{{productCode}} / {{batch}}</dd><dt>Production order</dt><dd>{{orderNumber}}</dd></dl>
  {{#if verificationInvalidated}}<div class="info-note"><span class="icon" aria-hidden="true">warning</span><span>Verification evidence was corrected after closure. Review it and verify this event again.</span></div>{{/if}}
  {{#if superseded}}<div class="info-note"><span class="icon" aria-hidden="true">history</span><span>Retained as superseded evidence after a measurement correction.</span></div>{{/if}}
  <form id="event-form" data-id="{{id}}">
    <div class="form-row"><label>Owner <span class="required">*</span><input name="owner" value="{{owner}}" required gaffa-disabled="readOnly" placeholder="Person responsible for follow-up"></label><label>Follow-up deadline (local time) <span class="required">*</span><input type="datetime-local" name="dueAt" value="{{dueInput}}" required gaffa-disabled="readOnly"></label></div>
    <label>Suspected cause <span class="required">*</span><input name="cause" value="{{cause}}" required gaffa-disabled="readOnly" placeholder="What might have changed?"></label>
    <label>Containment <span class="required">*</span><input name="containment" value="{{containment}}" required gaffa-disabled="readOnly" placeholder="How is affected product being held or checked?"></label>
    <label>Action taken <span class="required">*</span><input name="action" value="{{action}}" required gaffa-disabled="readOnly" placeholder="What has been adjusted or corrected?"></label>
    <label>Response notes <span class="required">*</span><textarea name="notes" rows="2" required gaffa-disabled="readOnly" placeholder="Record the observation and next step.">{{notes}}</textarea></label>
    <section class="response-verification"><h3>Verification before closure</h3><p>A quality engineer must link a later reading from the same order and parameter that is within specification and has no statistical signal.</p>
      {{#ifnot closed}}<button class="button" type="button" data-action="followup" data-id="{{id}}" gaffa-disabled="cannotFollowup"><span class="icon" aria-hidden="true">add_chart</span>Record follow-up</button><label>Verification measurement<select name="verifiedMeasurementId" gaffa-disabled="readOnly"><option value="">Choose a passing follow-up reading</option>{{#each verificationOptions}}<option value="{{id}}" gaffa-selected="selected">{{label}}</option>{{/each}}</select></label>{{#if noVerification}}<p class="field-help">No eligible follow-up yet. Record and evaluate a later reading first.</p>{{/if}}{{/ifnot}}
      {{#if hasVerification}}<p class="report-trace">Linked evidence: {{verificationReference}}</p><button class="text-link" type="button" data-action="measurement" data-id="{{verifiedMeasurementId}}">View verification reading<span class="icon" aria-hidden="true">arrow_outward</span></button>{{/if}}
      <label>Verification / effect<textarea name="verification" rows="2" gaffa-disabled="readOnly" placeholder="What does the follow-up demonstrate? Required for closure.">{{verification}}</textarea></label>
    </section>
    <div class="form-error" role="alert"></div>{{#ifnot closed}}<div class="dialog-actions"><button class="button" type="submit" name="status" value="Acknowledged" gaffa-disabled="cannotRespond">Save & acknowledge</button><button class="button primary" type="submit" name="status" value="Closed" gaffa-disabled="cannotApprove">Verify & close<span class="icon" aria-hidden="true">task_alt</span></button></div>{{/ifnot}}
  </form>
  <details class="timeline"><summary>Event history · {{transitionCount}} transitions</summary>{{#each transitions}}<p><strong>{{status}}</strong> · {{actor}}<small>{{time}}</small></p>{{#if response.action}}<p>{{response.containment}}<br>{{response.action}}<small>{{response.notes}} {{response.verification}}</small></p>{{/if}}{{/each}}</details>
  <div class="dialog-actions"><button class="button" data-action="order-report" data-id="{{orderId}}">Order report<span class="icon" aria-hidden="true">arrow_forward</span></button></div>
</template>

<template id="tpl-followup">
  <span class="badge blue">FOLLOW-UP ON {{orderNumber}}</span><h2 id="dialog-title">{{characteristic}}</h2><p class="dialog-intro">{{station}} · Batch {{batch}} · Investigating {{eventId}}</p>
  <p>{{instruction}}</p><form id="followup-form" data-event="{{eventId}}"><input type="hidden" name="submissionId" value="{{submissionId}}"><label>Measured value ({{unit}})<input name="value" inputmode="decimal" required autocomplete="off" placeholder="{{target}}"></label><p class="field-help">The reading is evaluated against the active specification and control limits. Any new signal creates its own event.</p><div class="form-error" role="alert"></div><div class="dialog-actions"><button class="button" type="button" data-action="event" data-id="{{eventId}}">Back to response</button><button class="button primary" type="submit">Save & evaluate<span class="icon" aria-hidden="true">arrow_forward</span></button></div></form>
</template>

<template id="tpl-load-customer"><h2 id="dialog-title">Load the customer scenario?</h2><p class="dialog-intro">Replace this browser's current demo workspace with Nordic Foods, two synthetic production orders and stable reference measurements. Your current demo readings, responses and layouts will be replaced.</p><p>All products and limits are illustrative. No customer systems are connected.</p><div class="dialog-actions"><button class="button" data-action="close-dialog">Keep current workspace</button><button class="button primary" data-action="confirm-customer">Load customer scenario</button></div></template>
<template id="tpl-restore-industrial"><h2 id="dialog-title">Restore the industrial scenario?</h2><p class="dialog-intro">Replace this browser's demo workspace with the original Nordic Precision scenario. Current demo readings, responses and layouts will be replaced.</p><div class="dialog-actions"><button class="button" data-action="close-dialog">Keep current workspace</button><button class="button primary" data-action="confirm-industrial">Restore industrial scenario</button></div></template>
